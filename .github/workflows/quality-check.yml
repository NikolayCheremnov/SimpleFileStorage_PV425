name: Quality check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Format (verify no changes)
        run: dotnet format --verify-no-changes
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test
        run: dotnet test
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: No implementation
        run: echo "not implemented"
  build-macos:
    runs-on: ubuntu-latest
    steps:
      - name: No implementation
        run: echo "not implemented"
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish (win-x64)
        run: |
          dotnet publish SimpleFileStorage/SimpleFileStorage.csproj -c Release -r win-x64 --self-contained false -o win-x64
      - name: Create zip artifact
        run: |
          zip -r win-x64.zip win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: win-x64.zip
